name: 📦 编译发布（含 SLSA Attestation）  # v2

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write      # 创建 Release
  id-token: write      # SLSA Attestation 必须
  attestations: write  # 写入构建证明

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    name: 编译 + Attest + 发布 Release

    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v4

      - name: ☕ 设置 Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🤖 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔧 设置 Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: 🔨 编译 Android APK
        run: |
          # 写入 local.properties 让 Gradle 找到 SDK
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          cat local.properties
          gradle assembleDebug --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: 📱 重命名 APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             YouTube登记助手-Android.apk

      - name: 💻 打包 Chrome 扩展
        run: |
          cd ChromeExtension
          zip -r ../YouTube登记助手-Chrome插件.zip . \
            --exclude "*.git*" --exclude "__MACOSX*"

      - name: 🍎 准备 iOS 文件
        run: cp mobile.html YouTube登记助手-iOS.html

      # ── SLSA Attestation（每个产物单独签名）──────────────
      - name: 🔏 Attest Android APK
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: YouTube登记助手-Android.apk

      - name: 🔏 Attest Chrome 插件
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: YouTube登记助手-Chrome插件.zip

      - name: 🔏 Attest iOS 文件
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: YouTube登记助手-iOS.html

      # ── 发布 Release ─────────────────────────────────────
      - name: 🚀 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "YouTube 登记助手 ${{ github.ref_name }}"
          body: |
            ## 📦 三端下载

            | 文件 | 平台 | 说明 |
            |------|------|------|
            | `YouTube登记助手-Android.apk` | 🤖 Android | 悬浮窗 App，可叠加在 YouTube 上方 |
            | `YouTube登记助手-Chrome插件.zip` | 💻 电脑 Chrome | 解压后在 `chrome://extensions` 加载 |
            | `YouTube登记助手-iOS.html` | 🍎 iOS / 手机 | Safari 打开后「添加到主屏幕」 |

            ## 🔏 构建证明（SLSA Provenance）
            所有产物均由 GitHub Actions 自动构建，并附有 SLSA v1.0 构建证明，可通过 GitHub Attestation API 验证。

            ## 📖 安装说明

            ### 💻 电脑版（Chrome 扩展）
            1. 下载并解压 `YouTube登记助手-Chrome插件.zip`
            2. 打开 `chrome://extensions` → 开启右上角「开发者模式」
            3. 点「加载已解压的扩展程序」→ 选择解压后的文件夹

            ### 🤖 Android 版
            1. 下载 APK → 安装（需允许「安装未知来源应用」）
            2. 打开 App → 授权悬浮窗 → 填写 Google Apps Script URL → 启动

            ### 🍎 iOS 版
            1. 下载 `YouTube登记助手-iOS.html`，用 Safari 打开
            2. 点底部「分享」→「添加到主屏幕」

          files: |
            YouTube登记助手-Android.apk
            YouTube登记助手-Chrome插件.zip
            YouTube登记助手-iOS.html
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
