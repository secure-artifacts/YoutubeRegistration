name: 📦 编译发布（含 SLSA Attestation）  # v4

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    name: 编译 + Attest + 发布 Release

    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v4

      - name: ☕ 设置 Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 手动安装 Android SDK，不依赖第三方 Action
      - name: 🤖 安装 Android SDK 完整组件
        run: |
          # 下载 Android 命令行工具
          mkdir -p $HOME/android-sdk/cmdline-tools
          curl -s https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdtools.zip
          unzip -q cmdtools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest

          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools

          # 接受所有协议并安装必需组件
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

          # 写入环境变量供后续步骤使用
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

          echo "✅ Android SDK 安装完成"
          ls $HOME/android-sdk/platforms/

      - name: 🔧 安装 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 🔨 编译 Android APK
        run: |
          echo "--- 环境检查 ---"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"
          gradle --version
          ls $ANDROID_SDK_ROOT/platforms/

          # 写入 SDK 路径
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "local.properties: $(cat local.properties)"

          # 编译
          gradle assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: 📱 重命名 APK
        run: cp app/build/outputs/apk/debug/app-debug.apk YouTube登记助手-Android.apk

      - name: 💻 打包 Chrome 扩展
        run: |
          cd ChromeExtension
          zip -r ../YouTube登记助手-Chrome插件.zip . --exclude "*.git*"

      - name: 🍎 准备 iOS 文件
        run: cp mobile.html YouTube登记助手-iOS.html

      - name: 🔏 Attest Android APK
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: YouTube登记助手-Android.apk

      - name: 🔏 Attest Chrome 插件
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: YouTube登记助手-Chrome插件.zip

      - name: 🔏 Attest iOS 文件
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: YouTube登记助手-iOS.html

      - name: 🚀 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "YouTube 登记助手 ${{ github.ref_name }}"
          body: |
            ## 📦 三端下载

            | 文件 | 平台 | 说明 |
            |------|------|------|
            | `YouTube登记助手-Android.apk` | 🤖 Android | 悬浮窗 App，可叠加在 YouTube 上方 |
            | `YouTube登记助手-Chrome插件.zip` | 💻 电脑 Chrome | 解压后在 `chrome://extensions` 加载 |
            | `YouTube登记助手-iOS.html` | 🍎 iOS / 手机 | Safari 打开后添加到主屏幕 |

            ## 🔏 SLSA 构建证明
            所有产物均由 GitHub Actions 自动构建，附有 SLSA v1.0 构建证明。

          files: |
            YouTube登记助手-Android.apk
            YouTube登记助手-Chrome插件.zip
            YouTube登记助手-iOS.html
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
