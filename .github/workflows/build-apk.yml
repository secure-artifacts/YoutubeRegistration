name: 📦 编译发布（含 SLSA Attestation）  # v3

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    name: 编译 + Attest + 发布 Release

    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v4

      - name: ☕ 设置 Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🤖 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔧 安装 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 🔍 调试环境
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          gradle --version
          ls $ANDROID_SDK_ROOT/platforms/ 2>/dev/null || echo "No platforms dir"

      - name: 🔨 生成 Wrapper 并编译 APK
        run: |
          # 生成 gradle-wrapper.jar（用已安装的 gradle）
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x gradlew

          # 写入 SDK 路径
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "local.properties 内容:"
          cat local.properties

          # 接受 SDK 协议
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

          # 编译
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: 📱 重命名 APK
        run: cp app/build/outputs/apk/debug/app-debug.apk YouTube登记助手-Android.apk

      - name: 💻 打包 Chrome 扩展
        run: |
          cd ChromeExtension
          zip -r ../YouTube登记助手-Chrome插件.zip . --exclude "*.git*"

      - name: 🍎 准备 iOS 文件
        run: cp mobile.html YouTube登记助手-iOS.html

      - name: 🔏 Attest Android APK
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: YouTube登记助手-Android.apk

      - name: 🔏 Attest Chrome 插件
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: YouTube登记助手-Chrome插件.zip

      - name: 🔏 Attest iOS 文件
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: YouTube登记助手-iOS.html

      - name: 🚀 发布到 GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "YouTube 登记助手 ${{ github.ref_name }}"
          body: |
            ## 📦 三端下载

            | 文件 | 平台 | 说明 |
            |------|------|------|
            | `YouTube登记助手-Android.apk` | 🤖 Android | 悬浮窗 App |
            | `YouTube登记助手-Chrome插件.zip` | 💻 电脑 Chrome | 解压后在 chrome://extensions 加载 |
            | `YouTube登记助手-iOS.html` | 🍎 iOS / 手机 | Safari 打开后添加到主屏幕 |

            ## 🔏 SLSA 构建证明
            所有产物均由 GitHub Actions 自动构建，附有 SLSA v1.0 构建证明。

          files: |
            YouTube登记助手-Android.apk
            YouTube登记助手-Chrome插件.zip
            YouTube登记助手-iOS.html
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
