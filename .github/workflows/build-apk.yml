name: 📦 自动编译并发布三端

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # 创建 Release 需要写权限

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    name: 编译 Android + 打包 Chrome + 发布 Release

    steps:
      # ── 1. 拉取代码 ──────────────────────────────────────────
      - name: 📥 拉取代码
        uses: actions/checkout@v4

      # ── 2. Java 环境 ─────────────────────────────────────────
      - name: ☕ 设置 Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Android SDK ───────────────────────────────────────
      - name: 🤖 设置 Android SDK
        uses: android-actions/setup-android@v3

      # ── 4. 编译 Android APK ──────────────────────────────────
      - name: 🔨 编译 Android APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # ── 5. 重命名 APK ────────────────────────────────────────
      - name: 📱 重命名 APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             YouTube登记助手-Android.apk

      # ── 6. 打包 Chrome 扩展 ──────────────────────────────────
      - name: 💻 打包 Chrome 扩展
        run: |
          cd ChromeExtension
          zip -r ../YouTube登记助手-Chrome插件.zip . \
            --exclude "*.git*" --exclude "__MACOSX*" --exclude "*.DS_Store"

      # ── 7. 准备 iOS 文件 ─────────────────────────────────────
      - name: 🍎 准备 iOS 文件
        run: |
          cp mobile.html YouTube登记助手-iOS.html

      # ── 8. 生成版本号 ────────────────────────────────────────
      - name: 🏷️ 生成版本号
        id: version
        run: |
          TAG="v$(date +'%Y.%m.%d-%H%M')"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "生成版本号: $TAG"

      # ── 9. 创建 GitHub Release 并上传三端文件 ────────────────
      - name: 🚀 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "YouTube 登记助手 ${{ steps.version.outputs.tag }}"
          body: |
            ## 📦 三端下载

            | 文件 | 平台 | 说明 |
            |------|------|------|
            | `YouTube登记助手-Android.apk` | 🤖 Android | 悬浮窗 App，可叠加在 YouTube 上方 |
            | `YouTube登记助手-Chrome插件.zip` | 💻 电脑 Chrome | 解压后在 `chrome://extensions` 加载 |
            | `YouTube登记助手-iOS.html` | 🍎 iOS / 手机 | Safari 打开后「添加到主屏幕」 |

            ## 📖 安装说明

            ### 💻 电脑版（Chrome 扩展）
            1. 下载并解压 `YouTube登记助手-Chrome插件.zip`
            2. 打开 `chrome://extensions` → 开启右上角「开发者模式」
            3. 点「加载已解压的扩展程序」→ 选择解压后的文件夹

            ### 🤖 Android 版
            1. 下载 APK → 安装（需允许「安装未知来源应用」）
            2. 打开 App → 授权悬浮窗 → 填写 Google Apps Script URL → 启动
            3. 按 Home 键，屏幕边角出现 📹 悬浮按钮 → 点击即可登记

            ### 🍎 iOS 版
            1. 下载 `YouTube登记助手-iOS.html`，用 Safari 打开
            2. 点底部「分享」→「添加到主屏幕」
            3. 在 YouTube 里复制链接 → 切换到此 App → 粘贴登记

          files: |
            YouTube登记助手-Android.apk
            YouTube登记助手-Chrome插件.zip
            YouTube登记助手-iOS.html
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 10. 输出 Release 链接 ───────────────────────────────
      - name: 🔗 输出下载链接
        run: |
          echo "✅ Release 已发布！"
          echo "🔗 下载地址: https://github.com/${{ github.repository }}/releases/latest"
