<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="YouTube登记">
  <meta name="theme-color" content="#0d0d1f">
  <meta name="description" content="YouTube 视频一键登记到谷歌表格 · 手机版">
  <title>YouTube 登记助手</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    :root {
      --blue:   #3b82f6; --indigo: #6366f1;
      --green:  #10b981; --amber:  #f59e0b;
      --glass:  rgba(255,255,255,0.06);
      --glass-b: rgba(255,255,255,0.12);
      --text:   #e8e8f5; --muted:  rgba(255,255,255,0.4);
      --r: 16px;
    }
    html { height: 100%; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh; min-height: 100dvh;
      background: #0a0a18;
      background-image:
        radial-gradient(ellipse 80% 60% at 20% 10%,  rgba(99,102,241,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 90%,  rgba(16,185,129,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 60% 40%,  rgba(59,130,246,0.08) 0%, transparent 50%);
      color: var(--text);
      display: flex; flex-direction: column; align-items: center;
      padding: max(env(safe-area-inset-top),16px) 14px max(env(safe-area-inset-bottom),28px);
    }

    /* HEADER */
    .header {
      width: 100%; max-width: 500px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 4px 2px 18px;
    }
    .logo-area { display: flex; align-items: center; gap: 10px; }
    .logo-icon {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--blue), var(--indigo));
      border-radius: 12px; display: flex; align-items: center; justify-content: center;
      font-size: 20px; box-shadow: 0 4px 16px rgba(99,102,241,0.4);
    }
    .logo-text {
      font-size: 18px; font-weight: 800; letter-spacing: -0.3px;
      background: linear-gradient(90deg, #93c5fd, #c4b5fd);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .logo-sub { font-size: 10px; color: var(--muted); font-weight: 500; margin-top: 1px; }
    .icon-btn {
      width: 42px; height: 42px; border-radius: 13px;
      background: var(--glass); border: 1px solid var(--glass-b);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 18px;
      transition: background .2s, transform .15s; user-select: none;
    }
    .icon-btn:active { transform: scale(0.88); background: rgba(255,255,255,0.12); }

    /* SETTINGS DRAWER */
    .settings-drawer {
      width: 100%; max-width: 500px;
      background: var(--glass);
      backdrop-filter: blur(32px); -webkit-backdrop-filter: blur(32px);
      border: 1px solid var(--glass-b); border-radius: 20px;
      padding: 18px; margin-bottom: 14px;
      display: none; animation: fadeSlide .3s cubic-bezier(.23,1,.32,1);
    }
    .settings-drawer.open { display: block; }
    .drawer-label {
      font-size: 10px; font-weight: 700; letter-spacing: 1.2px;
      color: var(--muted); text-transform: uppercase; margin-bottom: 10px;
    }

    /* INSTALL HINT */
    .install-hint {
      width: 100%; max-width: 500px;
      background: rgba(59,130,246,.08); border: 1px solid rgba(59,130,246,.2);
      border-radius: 14px; padding: 11px 16px;
      font-size: 12px; color: #93c5fd; margin-bottom: 12px; line-height: 1.6;
      display: flex; align-items: flex-start; gap: 10px;
    }
    .install-hint-close {
      margin-left: auto; cursor: pointer; opacity: .6;
      font-size: 18px; line-height: 1; flex-shrink: 0;
    }

    /* CARD */
    .card {
      width: 100%; max-width: 500px;
      background: var(--glass);
      backdrop-filter: blur(32px); -webkit-backdrop-filter: blur(32px);
      border: 1px solid var(--glass-b); border-radius: 24px;
      padding: 22px 20px;
      box-shadow: 0 2px 0 rgba(255,255,255,.07) inset, 0 20px 60px rgba(0,0,0,.5);
      animation: fadeSlide .4s cubic-bezier(.23,1,.32,1);
    }
    @keyframes fadeSlide {
      from { opacity:0; transform:translateY(18px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* MODE SWITCH */
    .mode-switch {
      display: flex; background: rgba(0,0,0,.35);
      border-radius: 14px; padding: 4px; margin-bottom: 22px;
      border: 1px solid rgba(255,255,255,.07); gap: 3px;
    }
    .mode-switch input[type="radio"] { display: none; }
    .mode-switch label {
      flex: 1; text-align: center; padding: 11px 8px;
      border-radius: 10px; font-size: 13px; font-weight: 700;
      color: var(--muted); cursor: pointer;
      transition: all .3s cubic-bezier(.23,1,.32,1); letter-spacing: .2px;
    }
    #mode1:checked + label {
      background: linear-gradient(135deg, var(--blue), var(--indigo));
      color: #fff; box-shadow: 0 4px 18px rgba(99,102,241,.45);
    }
    #mode2:checked + label {
      background: linear-gradient(135deg, var(--green), #059669);
      color: #fff; box-shadow: 0 4px 18px rgba(16,185,129,.4);
    }

    /* FIELDS */
    .field { margin-bottom: 15px; }
    .field-label {
      font-size: 10px; font-weight: 700; letter-spacing: 1px;
      color: var(--muted); text-transform: uppercase; margin-bottom: 8px;
      display: flex; align-items: center; gap: 8px;
    }
    input[type="text"], input[type="number"], input[type="url"], textarea, select {
      width: 100%;
      background: rgba(255,255,255,.07); border: 1.5px solid rgba(255,255,255,.1);
      border-radius: var(--r); padding: 13px 15px;
      font-size: 15px; color: var(--text); font-family: inherit; outline: none;
      transition: border-color .2s, background .2s, box-shadow .2s;
      -webkit-appearance: none; appearance: none;
    }
    input:focus, textarea:focus, select:focus {
      border-color: rgba(99,102,241,.55); background: rgba(255,255,255,.1);
      box-shadow: 0 0 0 3px rgba(99,102,241,.12);
    }
    input::placeholder, textarea::placeholder { color: rgba(255,255,255,.2); }
    textarea { resize: vertical; min-height: 72px; line-height: 1.55; }
    select { cursor: pointer; }
    select option { background: #1a1040; color: var(--text); }

    .input-row { display: flex; gap: 8px; }
    .input-row input { flex: 1; min-width: 0; }
    .pill-btn {
      padding: 0 14px; white-space: nowrap;
      background: rgba(99,102,241,.18); border: 1.5px solid rgba(99,102,241,.35);
      border-radius: var(--r); color: #a5b4fc;
      font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit;
      transition: all .2s; display: flex; align-items: center; gap: 4px;
    }
    .pill-btn:active { background: rgba(99,102,241,.35); transform: scale(.93); }

    .hint-row {
      font-size: 12px; margin-top: 7px; min-height: 18px;
      transition: all .2s; display: flex; align-items: center; gap: 5px;
    }
    .hint-row.muted   { color: var(--muted); }
    .hint-row.loading { color: #60a5fa; }
    .hint-row.ok      { color: #34d399; }
    .hint-row.error   { color: #f87171; }

    .badge {
      padding: 2px 9px; border-radius: 20px;
      font-size: 10px; font-weight: 700;
      text-transform: none; letter-spacing: 0;
    }
    .badge.unregistered { background: rgba(16,185,129,.18); color: #34d399; border: 1px solid rgba(16,185,129,.3); }
    .badge.registered   { background: rgba(239,68,68,.18);  color: #f87171; border: 1px solid rgba(239,68,68,.3); }

    .warn-box {
      display: none;
      background: rgba(245,158,11,.1); border: 1.5px solid rgba(245,158,11,.28);
      border-radius: 12px; padding: 10px 14px;
      font-size: 12px; color: #fbbf24; margin-bottom: 15px; line-height: 1.5;
    }
    .warn-box.show { display: flex; gap: 8px; }

    .divider { height: 1px; background: rgba(255,255,255,.07); margin: 18px 0; }

    /* BUTTONS */
    .btn-row { display: flex; gap: 10px; }
    button {
      flex: 1; padding: 16px 12px; border: none; border-radius: 14px;
      font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit;
      transition: all .2s cubic-bezier(.23,1,.32,1); letter-spacing: .2px;
      -webkit-appearance: none; appearance: none;
    }
    button:active:not(:disabled) { transform: scale(.95); }
    button:disabled { opacity: .45; cursor: not-allowed; transform: none !important; }

    #submitBtn {
      background: linear-gradient(135deg, var(--blue), var(--indigo));
      color: #fff; box-shadow: 0 6px 24px rgba(99,102,241,.38);
    }
    #modifyBtn {
      flex: 0.75;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #fff; box-shadow: 0 6px 20px rgba(245,158,11,.32);
    }
    #saveUrlBtn {
      background: rgba(255,255,255,.09); border: 1.5px solid rgba(255,255,255,.14);
      color: rgba(255,255,255,.65); font-size: 13px;
      padding: 11px; margin-top: 8px; border-radius: 11px;
    }

    #status {
      text-align: center; font-size: 14px; font-weight: 600;
      margin-top: 14px; min-height: 20px;
    }
    #status.success { color: #34d399; }
    #status.error   { color: #f87171; }

    body.waiwen-mode #submitBtn {
      background: linear-gradient(135deg, var(--green), #059669);
      box-shadow: 0 6px 24px rgba(16,185,129,.38);
    }

    .footer {
      margin-top: 20px; font-size: 11px;
      color: rgba(255,255,255,.18); text-align: center;
    }
  </style>
</head>

<body>

  <!-- Header -->
  <div class="header">
    <div class="logo-area">
      <div class="logo-icon">📹</div>
      <div>
        <div class="logo-text">YouTube 登记助手</div>
        <div class="logo-sub">手机版 · Mobile</div>
      </div>
    </div>
    <div class="icon-btn" id="settingsToggle">⚙️</div>
  </div>

  <!-- Install hint -->
  <div class="install-hint" id="installHint">
    <span>📌</span>
    <span>点击浏览器菜单 →「添加到主屏幕」，即可像 App 一样使用</span>
    <span class="install-hint-close" id="closeInstall">×</span>
  </div>

  <!-- Settings Drawer -->
  <div class="settings-drawer" id="settingsPanel">
    <div class="drawer-label">⚙️ Google Web App 配置</div>
    <input type="url" id="webAppUrl" placeholder="请粘贴 Apps Script 部署后的长网址" autocomplete="off">
    <button id="saveUrlBtn">💾 保存 URL</button>
    <div id="urlStatus" style="font-size:12px;margin-top:8px;text-align:center;color:var(--muted);"></div>
  </div>

  <!-- Main Card -->
  <div class="card">

    <!-- Mode Switch -->
    <div class="mode-switch">
      <input type="radio" id="mode1" name="workMode" value="视频打卡" checked>
      <label for="mode1">🎬 视频打卡</label>
      <input type="radio" id="mode2" name="workMode" value="外文点击">
      <label for="mode2">🌐 外文点击</label>
    </div>

    <!-- Video URL -->
    <div class="field">
      <div class="field-label">视频链接</div>
      <div class="input-row">
        <input type="url" id="urlInput" placeholder="粘贴 YouTube 链接…"
               autocomplete="off" autocorrect="off" spellcheck="false">
        <button class="pill-btn" id="pasteBtn" type="button">📋 粘贴</button>
      </div>
      <div class="hint-row muted" id="fetchStatus"></div>
    </div>

    <!-- Title -->
    <div class="field">
      <div class="field-label">
        视频标题
        <span class="badge" id="regBadge" style="display:none;"></span>
      </div>
      <input type="text" id="titleInput" placeholder="粘贴链接后自动获取，也可手动填写">
    </div>

    <!-- Duration (视频打卡 only) -->
    <div id="durationWrap">
      <div class="field">
        <div class="field-label">视频时长（分钟）</div>
        <input type="number" id="durationInput"
               placeholder="输入分钟数，超过 40 将自动登记 2 条" min="0" step="1">
      </div>
      <div class="warn-box" id="durationWarn">
        <span>⚠️</span>
        <span>视频超过 40 分钟，点击「登记」将自动写入 <strong>2 条</strong>相同记录</span>
      </div>
    </div>

    <!-- Daka Fields -->
    <div id="dakaFields">
      <div class="field">
        <div class="field-label">分类选项</div>
        <select id="category">
          <option value="朗诵视频">🔴 朗诵视频</option>
          <option value="生命经历">🟠 生命经历</option>
          <option value="新时代报道">🔵 新时代报道</option>
          <option value="精彩片段">🟢 精彩片段</option>
          <option value="电影">🟣 电影</option>
          <option value="信仰求真">🩵 信仰求真</option>
          <option value="诗歌舞蹈">🩷 诗歌舞蹈</option>
        </select>
      </div>
      <div class="field">
        <div class="field-label">备注（选填）</div>
        <textarea id="noteInput" placeholder="在此输入备注…"></textarea>
      </div>
    </div>

    <!-- Waiwen Fields -->
    <div id="waiwenFields" style="display:none;">
      <div class="field">
        <div class="field-label">手机点击数（选填）</div>
        <input type="number" id="mobileClicks" placeholder="请输入大于 0 的数字" min="1">
      </div>
    </div>

    <div class="divider"></div>

    <!-- Buttons -->
    <div class="btn-row">
      <button id="submitBtn">登记</button>
      <button id="modifyBtn" style="display:none;">✏️ 修改备注</button>
    </div>
    <div id="status"></div>

  </div>

  <div class="footer">YouTube 视频登记助手 · 手机版</div>

<script>
// ===================== 工具函数 =====================
function getTodayString() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}
function checkRegistered(url) {
  try {
    const h = JSON.parse(localStorage.getItem('mDailyHistory') || '{}');
    return (h[getTodayString()] || []).includes(url);
  } catch { return false; }
}
function saveRegistered(url) {
  try {
    const today = getTodayString();
    const h = JSON.parse(localStorage.getItem('mDailyHistory') || '{}');
    const newH = { [today]: h[today] || [] };
    if (!newH[today].includes(url)) newH[today].push(url);
    localStorage.setItem('mDailyHistory', JSON.stringify(newH));
  } catch {}
}
async function postData(targetUrl, body) {
  const res = await fetch(targetUrl, {
    method: 'POST', body,
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
}

// ===================== DOM 引用 =====================
const $ = id => document.getElementById(id);
const webAppUrlInput = $('webAppUrl');
const settingsToggle = $('settingsToggle');
const settingsPanel  = $('settingsPanel');
const saveUrlBtn     = $('saveUrlBtn');
const urlStatus      = $('urlStatus');
const installHint    = $('installHint');
const closeInstall   = $('closeInstall');
const urlInput       = $('urlInput');
const titleInput     = $('titleInput');
const fetchStatus    = $('fetchStatus');
const pasteBtn       = $('pasteBtn');
const regBadge       = $('regBadge');
const durationInput  = $('durationInput');
const durationWarn   = $('durationWarn');
const durationWrap   = $('durationWrap');
const dakaFields     = $('dakaFields');
const waiwenFields   = $('waiwenFields');
const category       = $('category');
const noteInput      = $('noteInput');
const mobileClicks   = $('mobileClicks');
const submitBtn      = $('submitBtn');
const modifyBtn      = $('modifyBtn');
const statusDiv      = $('status');
const modeRadios     = document.querySelectorAll('input[name="workMode"]');

// ===================== 初始化 =====================
const savedUrl = localStorage.getItem('mWebAppUrl');
if (savedUrl) webAppUrlInput.value = savedUrl;

// 安装提示仅显示一次
if (localStorage.getItem('installDismissed')) installHint.style.display = 'none';
closeInstall.addEventListener('click', () => {
  installHint.style.display = 'none';
  localStorage.setItem('installDismissed', '1');
});

// 支持从 URL 参数接收分享链接（配合 iOS 快捷指令 / Android Tasker）
(function readSharedUrl() {
  const params = new URLSearchParams(window.location.search);
  const shared = params.get('url') || params.get('text') || params.get('u');
  if (shared && (shared.includes('youtube') || shared.includes('youtu.be'))) {
    urlInput.value = shared.trim();
    autoFetchTitle(shared.trim());
  }
})();

// ===================== 设置面板 =====================
settingsToggle.addEventListener('click', () => {
  settingsPanel.classList.toggle('open');
});
saveUrlBtn.addEventListener('click', () => {
  const v = webAppUrlInput.value.trim();
  if (!v || !v.startsWith('http')) {
    urlStatus.textContent = '❌ 请输入有效链接';
    urlStatus.style.color = '#f87171'; return;
  }
  localStorage.setItem('mWebAppUrl', v);
  urlStatus.textContent = '✅ 已保存';
  urlStatus.style.color = '#34d399';
  setTimeout(() => urlStatus.textContent = '', 2500);
});

// ===================== 模式切换 =====================
function updateModeUI() {
  const isDaka = document.querySelector('input[name="workMode"]:checked').value === '视频打卡';
  dakaFields.style.display   = isDaka ? 'block' : 'none';
  waiwenFields.style.display = isDaka ? 'none'  : 'block';
  durationWrap.style.display = isDaka ? 'block' : 'none';
  modifyBtn.style.display    = isDaka ? ''      : 'none';
  document.body.classList.toggle('waiwen-mode', !isDaka);
}
modeRadios.forEach(r => r.addEventListener('change', updateModeUI));
updateModeUI();

// ===================== 时长警告 =====================
durationInput.addEventListener('input', () => {
  durationWarn.classList.toggle('show', (parseFloat(durationInput.value) || 0) > 40);
});

// ===================== 粘贴按钮 =====================
pasteBtn.addEventListener('click', async () => {
  try {
    const text = await navigator.clipboard.readText();
    if (text) { urlInput.value = text.trim(); autoFetchTitle(text.trim()); }
  } catch {
    urlInput.focus();
    setFetch('error', '请长按输入框，选择「粘贴」');
  }
});

// ===================== 自动获取视频标题 =====================
function setFetch(type, msg) {
  fetchStatus.textContent = msg;
  fetchStatus.className = 'hint-row ' + type;
}
function updateRegBadge(url) {
  if (!url) { regBadge.style.display = 'none'; return; }
  regBadge.style.display = '';
  if (checkRegistered(url)) {
    regBadge.textContent = '今日已登记';
    regBadge.className = 'badge registered';
    submitBtn.innerText = '重新登记（覆盖）';
  } else {
    regBadge.textContent = '未登记';
    regBadge.className = 'badge unregistered';
    submitBtn.innerText = '登记';
  }
}

let fetchTimer = null;
urlInput.addEventListener('input', () => {
  clearTimeout(fetchTimer);
  fetchTimer = setTimeout(() => autoFetchTitle(urlInput.value.trim()), 700);
});
urlInput.addEventListener('paste', () => {
  setTimeout(() => autoFetchTitle(urlInput.value.trim()), 150);
});

async function autoFetchTitle(url) {
  if (!url) { setFetch('muted', ''); regBadge.style.display = 'none'; return; }
  updateRegBadge(url);
  const isYT = url.includes('youtube.com/watch') || url.includes('youtu.be/');
  if (!isYT) { setFetch('error', '⚠️ 请输入有效的 YouTube 视频链接'); return; }

  setFetch('loading', '⏳ 正在获取视频信息…');
  try {
    // YouTube oEmbed 公开接口，无需 API Key
    const res = await fetch(
      `https://www.youtube.com/oembed?url=${encodeURIComponent(url)}&format=json`
    );
    if (!res.ok) throw new Error();
    const data = await res.json();
    titleInput.value = data.title || '';
    setFetch('ok', `✅ ${data.author_name || '获取成功'}`);
  } catch {
    setFetch('error', '❌ 自动获取失败，请手动填写标题');
  }
}

// ===================== 登记提交 =====================
submitBtn.addEventListener('click', async () => {
  const targetUrl = webAppUrlInput.value.trim();
  if (!targetUrl || !targetUrl.startsWith('http')) {
    statusDiv.textContent = '❌ 请先点击右上角 ⚙️ 配置 Web App URL';
    statusDiv.className = 'error'; return;
  }
  const url = urlInput.value.trim();
  if (!url) {
    statusDiv.textContent = '❌ 请先输入视频链接';
    statusDiv.className = 'error'; return;
  }

  const selectedMode = document.querySelector('input[name="workMode"]:checked').value;
  const durationMins = parseFloat(durationInput.value) || 0;
  const needDouble   = selectedMode === '视频打卡' && durationMins > 40;

  submitBtn.disabled = true;
  modifyBtn.disabled = true;
  statusDiv.className = '';
  submitBtn.textContent = needDouble ? '⏳ 发送中 (1/2)…' : '⏳ 正在发送…';

  const fd = new URLSearchParams();
  fd.append('action', 'register');
  fd.append('title', titleInput.value);
  fd.append('url',   url);
  fd.append('mode',  selectedMode);
  if (selectedMode === '视频打卡') {
    fd.append('option', category.value);
    fd.append('note',   noteInput.value);
  } else {
    fd.append('mobileClicks', mobileClicks.value);
  }

  try {
    await postData(targetUrl, fd);
    if (needDouble) {
      submitBtn.textContent = '⏳ 发送中 (2/2)…';
      await postData(targetUrl, fd);
      statusDiv.textContent = '✅ 登记成功！（超40分钟，已写入 2 条）';
    } else {
      statusDiv.textContent = '✅ 登记成功！';
    }
    statusDiv.className = 'success';
    submitBtn.textContent = '✅ 已完成';
    noteInput.value = '';
    mobileClicks.value = '';
    saveRegistered(url);
    updateRegBadge(url);
  } catch {
    statusDiv.textContent = '❌ 发送失败，请检查网络或 URL 配置';
    statusDiv.className = 'error';
    submitBtn.disabled = false;
    modifyBtn.disabled = false;
    submitBtn.textContent = '登记';
  }
});

// ===================== 修改备注 =====================
modifyBtn.addEventListener('click', async () => {
  const targetUrl = webAppUrlInput.value.trim();
  if (!targetUrl || !targetUrl.startsWith('http')) {
    statusDiv.textContent = '❌ 请先配置 Web App URL';
    statusDiv.className = 'error'; return;
  }
  modifyBtn.disabled = true;
  submitBtn.disabled = true;
  modifyBtn.textContent = '⏳ 修改中…';
  statusDiv.className = '';

  const fd = new URLSearchParams();
  fd.append('action', 'modify');
  fd.append('url',    urlInput.value.trim());
  fd.append('date',   getTodayString());
  fd.append('note',   noteInput.value.trim());

  try {
    await postData(targetUrl, fd);
    statusDiv.textContent = '✅ 备注修改成功！';
    statusDiv.className = 'success';
  } catch {
    statusDiv.textContent = '❌ 修改失败，请检查网络';
    statusDiv.className = 'error';
  } finally {
    modifyBtn.disabled = false;
    submitBtn.disabled = false;
    modifyBtn.textContent = '✏️ 修改备注';
  }
});
</script>
</body>
</html>
