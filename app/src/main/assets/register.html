<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YouTube 登记助手</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --blue: #3b82f6; --indigo: #6366f1; --green: #10b981;
      --glass: rgba(255,255,255,0.06); --glass-b: rgba(255,255,255,0.12);
      --text: #e8e8f5; --muted: rgba(255,255,255,0.4); --r: 14px;
    }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #0f172a; color: var(--text);
      padding: 14px 14px 24px; min-height: 100vh;
    }

    /* HEADER */
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .logo { font-size: 16px; font-weight: 800;
      background: linear-gradient(90deg, #93c5fd, #c4b5fd);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .close-btn {
      width: 34px; height: 34px; border-radius: 10px;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 15px; color: #9ca3af;
    }
    .close-btn:active { background: rgba(255,255,255,0.18); }

    /* SETTINGS */
    .settings-drawer {
      background: var(--glass); border: 1px solid var(--glass-b);
      border-radius: 16px; padding: 14px; margin-bottom: 12px;
      display: none;
    }
    .settings-drawer.open { display: block; }
    .settings-toggle {
      font-size: 11px; font-weight: 700; letter-spacing: 1px;
      color: var(--muted); cursor: pointer; text-transform: uppercase;
    }

    /* MODE SWITCH */
    .mode-switch {
      display: flex; background: rgba(0,0,0,0.4);
      border-radius: 12px; padding: 4px; margin-bottom: 16px;
      border: 1px solid rgba(255,255,255,0.07); gap: 3px;
    }
    .mode-switch input[type="radio"] { display: none; }
    .mode-switch label {
      flex: 1; text-align: center; padding: 10px 6px;
      border-radius: 9px; font-size: 12px; font-weight: 700;
      color: var(--muted); cursor: pointer;
      transition: all .25s; letter-spacing: .2px;
    }
    #mode1:checked + label { background: linear-gradient(135deg, var(--blue), var(--indigo)); color: #fff; box-shadow: 0 3px 14px rgba(99,102,241,.4); }
    #mode2:checked + label { background: linear-gradient(135deg, var(--green), #059669);  color: #fff; box-shadow: 0 3px 14px rgba(16,185,129,.4); }

    /* FIELDS */
    .field { margin-bottom: 12px; }
    .field-label {
      font-size: 10px; font-weight: 700; letter-spacing: 1px;
      color: var(--muted); text-transform: uppercase; margin-bottom: 6px;
      display: flex; align-items: center; gap: 7px;
    }
    input[type="text"], input[type="number"], input[type="url"], textarea, select {
      width: 100%; background: rgba(255,255,255,0.07);
      border: 1.5px solid rgba(255,255,255,0.1); border-radius: var(--r);
      padding: 12px 13px; font-size: 14px; color: var(--text);
      font-family: inherit; outline: none;
      transition: border-color .2s, background .2s;
      -webkit-appearance: none; appearance: none;
    }
    input:focus, textarea:focus, select:focus {
      border-color: rgba(99,102,241,0.55); background: rgba(255,255,255,0.1);
    }
    input::placeholder, textarea::placeholder { color: rgba(255,255,255,0.2); }
    textarea { resize: vertical; min-height: 64px; line-height: 1.5; }
    select { cursor: pointer; }
    select option { background: #1a1040; }

    .input-row { display: flex; gap: 7px; }
    .input-row input { flex: 1; min-width: 0; }
    .pill-btn {
      padding: 0 12px; white-space: nowrap;
      background: rgba(99,102,241,0.18); border: 1.5px solid rgba(99,102,241,0.35);
      border-radius: var(--r); color: #a5b4fc;
      font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit;
      display: flex; align-items: center;
    }
    .pill-btn:active { background: rgba(99,102,241,0.35); }

    .hint-row { font-size: 11px; margin-top: 5px; min-height: 16px; }
    .hint-row.muted { color: var(--muted); }
    .hint-row.loading { color: #60a5fa; }
    .hint-row.ok  { color: #34d399; }
    .hint-row.error { color: #f87171; }

    .badge { padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 700; }
    .badge.unregistered { background: rgba(16,185,129,0.18); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }
    .badge.registered   { background: rgba(239,68,68,0.18);  color: #f87171; border: 1px solid rgba(239,68,68,0.3); }

    .warn-box {
      display: none; background: rgba(245,158,11,0.1);
      border: 1.5px solid rgba(245,158,11,0.28); border-radius: 10px;
      padding: 9px 12px; font-size: 11px; color: #fbbf24; margin-bottom: 12px;
    }
    .warn-box.show { display: flex; gap: 7px; }

    .divider { height: 1px; background: rgba(255,255,255,0.07); margin: 14px 0; }

    /* BUTTONS */
    .btn-row { display: flex; gap: 9px; }
    button {
      flex: 1; padding: 14px 10px; border: none; border-radius: 13px;
      font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
      transition: all .2s; -webkit-appearance: none; appearance: none;
    }
    button:active:not(:disabled) { transform: scale(0.95); }
    button:disabled { opacity: 0.45; }
    #submitBtn { background: linear-gradient(135deg, var(--blue), var(--indigo)); color: #fff; box-shadow: 0 5px 20px rgba(99,102,241,0.35); }
    #modifyBtn { flex: 0.72; background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; }
    #saveUrlBtn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); color: rgba(255,255,255,0.6); font-size: 12px; padding: 9px; margin-top: 7px; border-radius: 10px; }

    #status { text-align: center; font-size: 13px; font-weight: 600; margin-top: 12px; min-height: 18px; }
    #status.success { color: #34d399; }
    #status.error   { color: #f87171; }

    body.waiwen-mode #submitBtn { background: linear-gradient(135deg, var(--green), #059669); }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo">📹 YouTube 登记助手</div>
    <div class="close-btn" onclick="closeApp()">✕</div>
  </div>

  <!-- Settings (collapsible) -->
  <div>
    <div class="settings-toggle" onclick="toggleSettings()">⚙️ Web App 设置 ▾</div>
    <div class="settings-drawer" id="settingsPanel">
      <input type="url" id="webAppUrl" placeholder="粘贴 Apps Script 部署后的长网址" autocomplete="off" style="margin-top:8px;">
      <button id="saveUrlBtn">💾 保存 URL</button>
      <div id="urlStatus" style="font-size:11px;margin-top:6px;text-align:center;color:var(--muted);"></div>
    </div>
  </div>

  <div style="height:14px;"></div>

  <!-- Mode Switch -->
  <div class="mode-switch">
    <input type="radio" id="mode1" name="workMode" value="视频打卡" checked>
    <label for="mode1">🎬 视频打卡</label>
    <input type="radio" id="mode2" name="workMode" value="外文点击">
    <label for="mode2">🌐 外文点击</label>
  </div>

  <!-- URL -->
  <div class="field">
    <div class="field-label">视频链接</div>
    <div class="input-row">
      <input type="url" id="urlInput" placeholder="粘贴 YouTube 链接…" autocomplete="off" autocorrect="off">
      <button class="pill-btn" id="pasteBtn" type="button">📋 粘贴</button>
    </div>
    <div class="hint-row muted" id="fetchStatus"></div>
  </div>

  <!-- Title -->
  <div class="field">
    <div class="field-label">
      视频标题
      <span class="badge" id="regBadge" style="display:none;"></span>
    </div>
    <input type="text" id="titleInput" placeholder="粘贴链接后自动获取…">
  </div>

  <!-- Duration -->
  <div id="durationWrap">
    <div class="field">
      <div class="field-label">视频时长（分钟）</div>
      <input type="number" id="durationInput" placeholder="超过 40 将自动登记 2 条" min="0" step="1">
    </div>
    <div class="warn-box" id="durationWarn">
      <span>⚠️</span><span>超过 40 分钟，将自动写入 <strong>2 条</strong>记录</span>
    </div>
  </div>

  <!-- Daka Fields -->
  <div id="dakaFields">
    <div class="field">
      <div class="field-label">分类选项</div>
      <select id="category">
        <option value="朗诵视频">🔴 朗诵视频</option>
        <option value="生命经历">🟠 生命经历</option>
        <option value="新时代报道">🔵 新时代报道</option>
        <option value="精彩片段">🟢 精彩片段</option>
        <option value="电影">🟣 电影</option>
        <option value="信仰求真">🩵 信仰求真</option>
        <option value="诗歌舞蹈">🩷 诗歌舞蹈</option>
      </select>
    </div>
    <div class="field">
      <div class="field-label">备注（选填）</div>
      <textarea id="noteInput" placeholder="在此输入备注…"></textarea>
    </div>
  </div>

  <!-- Waiwen Fields -->
  <div id="waiwenFields" style="display:none;">
    <div class="field">
      <div class="field-label">手机点击数（选填）</div>
      <input type="number" id="mobileClicks" placeholder="请输入大于 0 的数字" min="1">
    </div>
  </div>

  <div class="divider"></div>

  <div class="btn-row">
    <button id="submitBtn">登记</button>
    <button id="modifyBtn" style="display:none;">✏️ 修改备注</button>
  </div>
  <div id="status"></div>

<script>
// ======= 工具函数 =======
function getTodayString() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}
function checkRegistered(url) {
  try {
    const h = JSON.parse(localStorage.getItem('mDailyHistory') || '{}');
    return (h[getTodayString()] || []).includes(url);
  } catch { return false; }
}
function saveRegistered(url) {
  try {
    const today = getTodayString();
    const h = JSON.parse(localStorage.getItem('mDailyHistory') || '{}');
    const newH = { [today]: h[today] || [] };
    if (!newH[today].includes(url)) newH[today].push(url);
    localStorage.setItem('mDailyHistory', JSON.stringify(newH));
  } catch {}
}
async function postData(targetUrl, body) {
  const res = await fetch(targetUrl, {
    method: 'POST', body,
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
}
function closeApp() {
  // 调用 Android 原生桥接关闭面板
  if (window.AndroidBridge) window.AndroidBridge.closePanel();
}
function toggleSettings() {
  document.getElementById('settingsPanel').classList.toggle('open');
}

// ======= DOM =======
const $ = id => document.getElementById(id);
const webAppUrlInput = $('webAppUrl');
const urlInput = $('urlInput');
const titleInput = $('titleInput');
const fetchStatus = $('fetchStatus');
const regBadge = $('regBadge');
const durationInput = $('durationInput');
const durationWarn = $('durationWarn');
const durationWrap = $('durationWrap');
const dakaFields = $('dakaFields');
const waiwenFields = $('waiwenFields');
const category = $('category');
const noteInput = $('noteInput');
const mobileClicks = $('mobileClicks');
const submitBtn = $('submitBtn');
const modifyBtn = $('modifyBtn');
const statusDiv = $('status');

// ======= 初始化 =======
const savedUrl = localStorage.getItem('mWebAppUrl');
if (savedUrl) webAppUrlInput.value = savedUrl;

// 读取 URL 参数（Android 可通过 loadUrl("file://...?url=xxx") 传入）
(function() {
  const params = new URLSearchParams(window.location.search);
  const shared = params.get('url') || params.get('u');
  if (shared) { urlInput.value = shared; autoFetchTitle(shared); }
})();

// 保存 URL
$('saveUrlBtn').addEventListener('click', () => {
  const v = webAppUrlInput.value.trim();
  if (!v) { $('urlStatus').textContent = '❌ 请输入有效链接'; return; }
  localStorage.setItem('mWebAppUrl', v);
  $('urlStatus').textContent = '✅ 已保存';
  $('urlStatus').style.color = '#34d399';
  setTimeout(() => $('urlStatus').textContent = '', 2000);
});

// ======= 模式切换 =======
function updateModeUI() {
  const isDaka = document.querySelector('input[name="workMode"]:checked').value === '视频打卡';
  dakaFields.style.display   = isDaka ? 'block' : 'none';
  waiwenFields.style.display = isDaka ? 'none'  : 'block';
  durationWrap.style.display = isDaka ? 'block' : 'none';
  modifyBtn.style.display    = isDaka ? ''      : 'none';
  document.body.classList.toggle('waiwen-mode', !isDaka);
}
document.querySelectorAll('input[name="workMode"]').forEach(r => r.addEventListener('change', updateModeUI));
updateModeUI();

// 时长警告
durationInput.addEventListener('input', () => {
  durationWarn.classList.toggle('show', (parseFloat(durationInput.value) || 0) > 40);
});

// 粘贴按钮
$('pasteBtn').addEventListener('click', async () => {
  try {
    const text = await navigator.clipboard.readText();
    if (text) { urlInput.value = text.trim(); autoFetchTitle(text.trim()); }
  } catch {
    urlInput.focus();
    setFetch('error', '请长按输入框选择「粘贴」');
  }
});

// ======= 自动获取标题 =======
function setFetch(type, msg) {
  fetchStatus.textContent = msg;
  fetchStatus.className = 'hint-row ' + type;
}
function updateRegBadge(url) {
  if (!url) { regBadge.style.display = 'none'; return; }
  regBadge.style.display = '';
  if (checkRegistered(url)) {
    regBadge.textContent = '今日已登记';
    regBadge.className = 'badge registered';
    submitBtn.innerText = '重新登记（覆盖）';
  } else {
    regBadge.textContent = '未登记';
    regBadge.className = 'badge unregistered';
    submitBtn.innerText = '登记';
  }
}

let fetchTimer = null;
urlInput.addEventListener('input', () => {
  clearTimeout(fetchTimer);
  fetchTimer = setTimeout(() => autoFetchTitle(urlInput.value.trim()), 700);
});
urlInput.addEventListener('paste', () => {
  setTimeout(() => autoFetchTitle(urlInput.value.trim()), 150);
});

async function autoFetchTitle(url) {
  if (!url) { setFetch('muted', ''); regBadge.style.display = 'none'; return; }
  updateRegBadge(url);
  if (!url.includes('youtube.com/watch') && !url.includes('youtu.be/')) {
    setFetch('error', '⚠️ 请输入 YouTube 视频链接'); return;
  }
  setFetch('loading', '⏳ 正在获取视频信息…');
  try {
    const res = await fetch(`https://www.youtube.com/oembed?url=${encodeURIComponent(url)}&format=json`);
    if (!res.ok) throw new Error();
    const data = await res.json();
    titleInput.value = data.title || '';
    setFetch('ok', `✅ ${data.author_name || '获取成功'}`);
  } catch {
    setFetch('error', '❌ 自动获取失败，请手动填写标题');
  }
}

// ======= 登记提交 =======
submitBtn.addEventListener('click', async () => {
  const targetUrl = webAppUrlInput.value.trim();
  if (!targetUrl || !targetUrl.startsWith('http')) {
    statusDiv.textContent = '❌ 请先在顶部设置中配置 Web App URL';
    statusDiv.className = 'error'; return;
  }
  const url = urlInput.value.trim();
  if (!url) { statusDiv.textContent = '❌ 请先输入视频链接'; statusDiv.className = 'error'; return; }

  const selectedMode = document.querySelector('input[name="workMode"]:checked').value;
  const durationMins = parseFloat(durationInput.value) || 0;
  const needDouble = selectedMode === '视频打卡' && durationMins > 40;

  submitBtn.disabled = true; modifyBtn.disabled = true;
  statusDiv.className = '';
  submitBtn.textContent = needDouble ? '⏳ 发送中 (1/2)…' : '⏳ 正在发送…';

  const fd = new URLSearchParams();
  fd.append('action', 'register');
  fd.append('title', titleInput.value);
  fd.append('url', url);
  fd.append('mode', selectedMode);
  if (selectedMode === '视频打卡') {
    fd.append('option', category.value);
    fd.append('note', noteInput.value);
  } else {
    fd.append('mobileClicks', mobileClicks.value);
  }

  try {
    await postData(targetUrl, fd);
    if (needDouble) {
      submitBtn.textContent = '⏳ 发送中 (2/2)…';
      await postData(targetUrl, fd);
      statusDiv.textContent = '✅ 登记成功！（超40分钟，已写入 2 条）';
    } else {
      statusDiv.textContent = '✅ 登记成功！';
    }
    statusDiv.className = 'success';
    submitBtn.textContent = '✅ 已完成';
    noteInput.value = ''; mobileClicks.value = '';
    saveRegistered(url); updateRegBadge(url);
  } catch {
    statusDiv.textContent = '❌ 发送失败，请检查网络';
    statusDiv.className = 'error';
    submitBtn.disabled = false; modifyBtn.disabled = false;
    submitBtn.textContent = '登记';
  }
});

// ======= 修改备注 =======
modifyBtn.addEventListener('click', async () => {
  const targetUrl = webAppUrlInput.value.trim();
  if (!targetUrl) { statusDiv.textContent = '❌ 请先配置 Web App URL'; statusDiv.className = 'error'; return; }
  modifyBtn.disabled = true; submitBtn.disabled = true;
  modifyBtn.textContent = '⏳ 修改中…'; statusDiv.className = '';
  const fd = new URLSearchParams();
  fd.append('action', 'modify');
  fd.append('url', urlInput.value.trim());
  fd.append('date', getTodayString());
  fd.append('note', noteInput.value.trim());
  try {
    await postData(targetUrl, fd);
    statusDiv.textContent = '✅ 备注修改成功！';
    statusDiv.className = 'success';
  } catch {
    statusDiv.textContent = '❌ 修改失败，请检查网络';
    statusDiv.className = 'error';
  } finally {
    modifyBtn.disabled = false; submitBtn.disabled = false;
    modifyBtn.textContent = '✏️ 修改备注';
  }
});
</script>
</body>
</html>
